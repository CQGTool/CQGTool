
name: SchoolEye Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # 1. VALIDATE ENVIRONMENT
  # ==========================================
  validate:
    name: Validate Environment
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Validate .NET and IIS
        shell: powershell
        run: |
          Write-Host "Checking .NET..."
          dotnet --version

          Write-Host "Checking IIS..."
          Import-Module WebAdministration

          Get-WebAppPoolState -Name "Newpool"

          Write-Host "Environment validation completed."


  # ==========================================
  # 2. BUILD UI AND API
  # ==========================================
  build:
    name: Build UI and API
    runs-on: self-hosted
    needs: validate

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Restore
        run: |
          dotnet restore BlazorGlobalizationDashboard.slnx

      - name: Build
        run: |
          dotnet build BlazorGlobalizationDashboard.slnx `
            --configuration Release `
            --no-restore


  # ==========================================
  # 3. RUN TESTS
  # ==========================================
  test:
    name: Run Tests
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Restore
        run: |
          dotnet restore BlazorGlobalizationDashboard.slnx

      - name: Build for Tests
        run: |
          dotnet build BlazorGlobalizationDashboard.slnx `
            --configuration Release `
            --no-restore

      - name: Run Tests
        run: |
          dotnet test BlazorGlobalizationDashboard.slnx `
            --configuration Release `
            --no-build


  # ==========================================
  # 4. PUBLISH AND DEPLOY TO IIS
  # ==========================================
  deploy:
    name: Publish and Deploy to Local IIS
    runs-on: self-hosted
    needs: test

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup .NET 10
      # ----------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ----------------------------------------
      # Restore
      # ----------------------------------------
      - name: Restore
        run: |
          dotnet restore BlazorGlobalizationDashboard.slnx

      # ----------------------------------------
      # Stop IIS App Pool
      # ----------------------------------------
      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Stopping IIS App Pool: Newpool"

          Stop-WebAppPool -Name "Newpool"

          Write-Host "Waiting for IIS App Pool to stop..."

          $timeout = 30
          $elapsed = 0

          do {
              Start-Sleep -Seconds 1

              $state = (Get-WebAppPoolState -Name "Newpool").Value

              Write-Host "App Pool State: $state"

              $elapsed++

          } while ($state -ne "Stopped" -and $elapsed -lt $timeout)

          if ($state -ne "Stopped") {
              throw "IIS App Pool did not stop within 30 seconds."
          }

          Write-Host "IIS App Pool stopped successfully."


      # ----------------------------------------
      # Prepare Publish Folder
      # ----------------------------------------
      - name: Prepare Publish Folder
        shell: powershell
        run: |
          $publishPath = "D:\PublishNew"

          Write-Host "Publish path: $publishPath"

          if (-not (Test-Path $publishPath)) {

              Write-Host "Publish folder does not exist. Creating..."

              New-Item `
                -ItemType Directory `
                -Path $publishPath `
                -Force | Out-Null
          }

          Write-Host "Cleaning publish folder..."

          Get-ChildItem $publishPath -Force |
            Remove-Item -Recurse -Force -ErrorAction Stop

          Write-Host "Publish folder cleaned successfully."


      # ----------------------------------------
      # Publish Application
      # ----------------------------------------
      - name: Publish Application
        shell: powershell
        run: |
          dotnet publish `
            "BlazorGlobalizationDashboard/BlazorGlobalizationDashboard.csproj" `
            --configuration Release `
            --output "D:\PublishNew" `
            --no-restore


      # ----------------------------------------
      # Verify Published Files
      # ----------------------------------------
      - name: Verify Published Files
        shell: powershell
        run: |
          $publishPath = "D:\PublishNew"

          Write-Host "Checking published files..."

          if (-not (Test-Path $publishPath)) {
              throw "Publish folder does not exist."
          }

          $files = Get-ChildItem `
            $publishPath `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
              throw "Publish folder is empty."
          }

          Write-Host ""
          Write-Host "================================"
          Write-Host "Published Files"
          Write-Host "================================"

          $files | ForEach-Object {
              Write-Host $_.FullName
          }

          Write-Host ""
          Write-Host "Total published files: $($files.Count)"


      # ----------------------------------------
      # Start IIS App Pool
      # ----------------------------------------
      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Starting IIS App Pool: Newpool"

          Start-WebAppPool -Name "Newpool"

          Start-Sleep -Seconds 3

          $state = (Get-WebAppPoolState -Name "Newpool").Value

          Write-Host "App Pool State: $state"

          if ($state -ne "Started") {
              throw "IIS App Pool failed to start."
          }

          Write-Host ""
          Write-Host "================================"
          Write-Host "DEPLOYMENT COMPLETED SUCCESSFULLY"
          Write-Host "================================"

