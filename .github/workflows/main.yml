name: SchoolEye Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check .NET
        shell: powershell
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Validate IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          Get-WebAppPoolState -Name "Newpool"

      - name: Restore
        run: dotnet restore "BlazorGlobalizationDashboard.slnx"

      - name: Build
        run: dotnet build "BlazorGlobalizationDashboard.slnx" --configuration Release --no-restore

      - name: Stop App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "Newpool"

      - name: Publish Application
        shell: powershell
        run: |
          dotnet publish ".\BlazorGlobalizationDashboard\BlazorGlobalizationDashboard.csproj" `
            --configuration Release `
            --output "D:\PublishNew" `
            --no-restore

      - name: Check Publish Folder
        shell: powershell
        run: |
          Write-Host "Publish folder:"
          Get-ChildItem "D:\PublishNew"

      - name: Start App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "Newpool"

          Write-Host "Deployment completed successfully."
